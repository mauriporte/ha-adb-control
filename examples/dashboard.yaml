# Dashboard view for ADB Control: paste into a dashboard's raw configuration editor as a view.
# Replace 192.168.1.10 with the container host. The viewer is plain http, so it only loads when Home Assistant
# itself is opened over http on the LAN (an https Home Assistant page blocks http frames).
# One full-width section keeps this layout at any screen width (one card per device, then the screens) and leaves a
# margin on both sides; for a thinner margin, give the view a theme with e.g. `ha-view-sections-column-gap: 11px`.
# For remote access use the https address instead (see the README), e.g. https://adbcontrol.example.com/view?key=<key>
title: ADB
path: adb
icon: mdi:cellphone
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: vertical-stack
        grid_options:
          columns: full
        cards:
          - type: heading
            heading: ADB Control
            icon: mdi:cellphone-link
          # one card per device (repeat for each device): its name, with the battery on the right, above its
          # ADB Control switch; the rest only while it is connected
          - type: grid
            columns: 4
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Phone A
                    icon: mdi:cellphone
                    heading_style: title
                    # optional: the battery from the Home Assistant companion app; one badge per colour, so the
                    # colour follows the level (green 50 % or more, orange 20-49 %, red below 20 %)
                    badges:
                      - type: entity
                        entity: sensor.phone_a_battery_level
                        color: green
                        visibility:
                          - condition: numeric_state
                            entity: sensor.phone_a_battery_level
                            above: 49
                      - type: entity
                        entity: sensor.phone_a_battery_level
                        color: orange
                        visibility:
                          - condition: numeric_state
                            entity: sensor.phone_a_battery_level
                            above: 19
                            below: 50
                      - type: entity
                        entity: sensor.phone_a_battery_level
                        color: red
                        visibility:
                          - condition: numeric_state
                            entity: sensor.phone_a_battery_level
                            below: 20
                  - type: entities
                    show_header_toggle: false
                    state_color: true
                    entities:
                      - entity: switch.adb_phone_a
                        name: ADB Control
                        icon: mdi:cellphone-link
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.adb_phone_a_conectado
                            state: "on"
                        row:
                          entity: switch.pantalla_phone_a
                          name: Pantalla
                          icon: mdi:monitor-cellphone
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.adb_phone_a_conectado
                            state: "on"
                        row:
                          entity: switch.phone_a_horizontal
                          name: Horizontal
                          icon: mdi:phone-rotate-landscape
          - type: iframe
            url: http://192.168.1.10:8002/view
            aspect_ratio: 110%

# Dashboard view (panel) for ADB Control: paste into a dashboard's raw configuration editor as a view.
# Replace 192.168.1.10 with the container host. The viewer is plain http, so it only loads when Home Assistant
# itself is opened over http on the LAN (an https Home Assistant page blocks http frames).
# A panel view keeps this layout at any screen width: the top row, one card per device, then the screens.
# For remote access use the https address instead (see the README), e.g. https://adbcontrol.example.com/view?key=<key>
title: ADB
path: adb
icon: mdi:cellphone
type: panel
cards:
  - type: vertical-stack
    cards:
      - type: heading
        heading: ADB Control
        icon: mdi:cellphone-link
      # one card per device, always shown: its ADB Control switch on top, the rest only while it is connected
      # (repeat for each device)
      - type: grid
        columns: 4
        square: false
        cards:
          - type: entities
            title: Phone A
            icon: mdi:cellphone
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.adb_phone_a
                name: ADB Control
                icon: mdi:cellphone-link
              - type: conditional
                conditions:
                  - entity: binary_sensor.adb_phone_a_conectado
                    state: "on"
                row:
                  entity: switch.pantalla_phone_a
                  name: Pantalla
                  icon: mdi:monitor-cellphone
              - type: conditional
                conditions:
                  - entity: binary_sensor.adb_phone_a_conectado
                    state: "on"
                row:
                  entity: switch.phone_a_horizontal
                  name: Horizontal
                  icon: mdi:phone-rotate-landscape
      - type: iframe
        url: http://192.168.1.10:8002/view
        aspect_ratio: 110%
